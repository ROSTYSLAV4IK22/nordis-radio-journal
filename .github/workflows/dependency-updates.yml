name: Dependency Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

jobs:
  dependency-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run dependencyUpdates
        run: ./gradlew dependencyUpdates
